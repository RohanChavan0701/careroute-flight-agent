name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r flight_agent/requirements.txt
      - run: python -m pytest -q flight_agent/test_flight_agent.py
      - run: docker build --tag careroute-flight-agent:ci .
